[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-backtrader-webapp"
version = "0.3.0"
description = "A Personal Quant Project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backtrader==1.9.78.123",
    "duckdb>=1.5.0",
    "empyrical-reloaded>=0.5.12",
    "flask>=3.1.3",
    "graphifyy>=0.3.11",
    "jupyterlab>=4.5.3",
    "loguru==0.7.3",
    "marimo>=0.19.6",
    "matplotlib>=3.8.0",
    "numpy>=2.1,<3.0",
    "pandas==2.3.3",
    "pandas-datareader>=0.10.0",
    "pandas-stubs~=2.2.3",
    "pyarrow>=18.0.0",
    "pip>=26.1.1",
    "pre-commit==4.2.0",
    "pydantic==2.11.3",
    "pyecharts==2.0.8",
    "pykx==4.1.0",
    "pyrefly>=0.60.0",
    "pyyaml==6.0.2",
    "streamlit==1.44.1",
    "streamlit-echarts==0.4.0",
    "tables>=3.10.2",
    "tabulate>=0.10.0",
    "tushare>=1.4.19",
    "xtquant-big-convert[valkey]",
]

[tool.setuptools]
packages = ["src", "src.datahub", "src.datahub.providers", "src.trading", "examples"]

[tool.setuptools.package-data]
charts = ["*.ttf"]
"src.datahub" = ["config/*.yaml"]

[tool.uv]
package = true

[tool.uv.sources]
xtquant-big-convert = { path = "../xtquant-big-convert", editable = true }
qmt-parser = { path = "../qmt-parser/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
qmt-tools = ["qmt-parser"]

[tool.pytest.ini_options]
markers = [
    "integration: requires real Tushare credentials or a running QMT bridge",
]
